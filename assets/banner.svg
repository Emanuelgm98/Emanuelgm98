<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Emanuel G.Michea — Cloud and DevSecOps Engineer</title>
  <desc id="desc">Dark navy banner with the name Emanuel G.Michea, the role Cloud and DevSecOps Engineer, and a gold EGM monogram in a hexagonal seal.</desc>
  <defs>
