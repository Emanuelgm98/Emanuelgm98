<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Emanuel G.Michea — Cloud and DevSecOps Engineer</title>
  <desc id="desc">Dark navy professional cloud engineering banner with a gold vector GRIFFIN crest.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset=".58" stop-color="#0A1D35"/>
      <stop offset="1" stop-color="#102B49"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5E4B0"/>
      <stop offset=".48" stop-color="#D6AE5B"/>
      <stop offset="1" stop-color="#A9792D"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#75A6D0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#75A6D0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#75A6D0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#D6AE5B" stop-opacity=".16"/>
      <stop offset="1" stop-color="#D6AE5B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <path d="M0 42H1200M0 278H1200" stroke="#C4D5E5" stroke-opacity=".08"/>
  <path d="M0 250H790" stroke="url(#blue)" stroke-width="2"/>
  <circle cx="1040" cy="155" r="190" fill="url(#glow)"/>

  <!-- Restrained cloud-network geometry -->
  <g fill="none" stroke="#8FB2D0" stroke-opacity=".15" stroke-width="1.4">
    <path d="M36 74H190L238 122H382M160 74L208 122V186H330M36 226H174L224 176H350"/>
    <path d="M744 66H824L868 110H914M750 254H842L886 210H930"/>
    <circle cx="36" cy="74" r="3" fill="#8FB2D0"/>
    <circle cx="382" cy="122" r="3" fill="#8FB2D0"/>
    <circle cx="330" cy="186" r="3" fill="#8FB2D0"/>
    <circle cx="36" cy="226" r="3" fill="#8FB2D0"/>
  </g>

  <path d="M64 48V270" stroke="url(#gold)" stroke-width="2.2"/>
  <text x="98" y="119" fill="#F3F6FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="57" font-weight="700" letter-spacing="-1.2">Emanuel G.Michea</text>
  <path d="M99 142H735" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="101" y="180" fill="#E2ECF5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3.1">CLOUD &amp; DEVSECOPS ENGINEER</text>
  <text x="101" y="213" fill="#AFC3D6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="1.65">AWS CLOUD  ·  ARCHITECTURE  ·  AUTOMATION  ·  SECURITY</text>
  <g transform="translate(101 251)">
    <path d="M0 0H188" stroke="#D6AE5B" stroke-width="2.2" stroke-linecap="round"/>
    <text x="0" y="26" fill="#D5E0E9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2.3">SECURITY BY DESIGN  /  AWS-FIRST</text>
  </g>

  <!-- GRIFFIN: self-contained vector crest; no embedded raster or external assets -->
  <g transform="translate(920 15)">
    <circle cx="126" cy="145" r="128" fill="#071426" fill-opacity=".92" stroke="url(#gold)" stroke-width="2.4"/>
    <circle cx="126" cy="145" r="117" fill="none" stroke="#D6AE5B" stroke-opacity=".5" stroke-width="1.1"/>
    <circle cx="126" cy="145" r="103" fill="none" stroke="#8FB2D0" stroke-opacity=".18" stroke-width="1" stroke-dasharray="2 7"/>
    <!-- Wings -->
    <path d="M119 119C96 78 60 70 42 83C63 88 76 103 81 121C61 111 47 113 35 126C59 126 75 138 86 155C94 143 105 132 119 119Z"
          fill="url(#gold)" fill-opacity=".92" stroke="#F3E2B0" stroke-width="1.2"/>
    <path d="M133 119C156 78 192 70 210 83C189 88 176 103 171 121C191 111 205 113 217 126C193 126 177 138 166 155C158 143 147 132 133 119Z"
          fill="url(#gold)" fill-opacity=".92" stroke="#F3E2B0" stroke-width="1.2"/>
    <g fill="none" stroke="#75521F" stroke-opacity=".8" stroke-width="2">
      <path d="M52 91L88 130M43 119L82 145M200 91L164 130M209 119L170 145"/>
    </g>
    <!-- Griffin head and chest -->
    <path d="M126 91C105 91 91 106 93 128C95 145 108 153 111 170L102 190L126 181L150 190L141 170C144 153 157 145 159 128C161 106 147 91 126 91Z"
          fill="url(#gold)" stroke="#F3E2B0" stroke-width="1.5"/>
    <path d="M111 111C102 105 96 108 91 115L108 122L119 119Z" fill="#F5E4B0"/>
    <path d="M141 111C150 105 156 108 161 115L144 122L133 119Z" fill="#F5E4B0"/>
    <path d="M112 132L122 137L126 132L130 137L140 132" fill="none" stroke="#725020" stroke-width="2" stroke-linecap="round"/>
    <path d="M126 139L119 149L126 154L133 149Z" fill="#75521F"/>
    <path d="M126 154V174M112 161L126 168L140 161" fill="none" stroke="#75521F" stroke-width="2" stroke-linecap="round"/>
    <path d="M99 194L126 185L153 194" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <text x="126" y="231" text-anchor="middle" fill="#F3E2B0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="2.6">CLOUD • SECURITY</text>
    <text x="126" y="281" text-anchor="middle" fill="url(#gold)" font-family="Georgia,serif" font-size="17" font-weight="700" letter-spacing="5">GRIFFIN</text>
  </g>
  <path d="M64 296H1138" stroke="#AFC3D6" stroke-opacity=".16"/>
</svg>
