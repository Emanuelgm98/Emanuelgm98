<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">GitOps delivery flow</title>
  <desc id="desc">Reviewed change moves through quality and security gates, authenticates to AWS with OIDC, runs a Terraform plan with a read-only role, then applies after a manual production approval, leaving audit evidence.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#5C82A0"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#D6AE5B"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="18" fill="#0A1A2B" stroke="#1E3A52"/>
  <text x="40" y="48" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="2.1">GITOPS DELIVERY FLOW</text>
  <text x="40" y="72" fill="#8CA5BA" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5">From reviewed change to auditable deployment</text>
  <text x="920" y="48" fill="#D6AE5B" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="1.8" text-anchor="end">DEVELOP · MAIN</text>
  <path d="M40 88H920" stroke="#D6AE5B" stroke-opacity="0.4"/>

  <rect x="40" y="116" width="196" height="88" rx="10" fill="#102437" stroke="#22425C"/>
  <text x="56" y="138" fill="#D6AE5B" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.6">01 · CHANGE</text>
  <text x="56" y="165" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">Commit / pull request</text>
  <text x="56" y="185" fill="#8CA5BA" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="10.5">reviewed on develop and main</text>

  <rect x="268" y="116" width="196" height="88" rx="10" fill="#102437" stroke="#22425C"/>
  <text x="284" y="138" fill="#D6AE5B" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.6">02 · GATES</text>
  <text x="284" y="165" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">Quality + security</text>
  <text x="284" y="185" fill="#8CA5BA" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="10.5">tests · Checkov · Trivy · Gitleaks</text>

  <rect x="496" y="116" width="196" height="88" rx="10" fill="#102437" stroke="#22425C"/>
  <text x="512" y="138" fill="#D6AE5B" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.6">03 · AUTH</text>
  <text x="512" y="165" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">OIDC to AWS</text>
  <text x="512" y="185" fill="#8CA5BA" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="10.5">short-lived credentials</text>

  <rect x="724" y="116" width="196" height="88" rx="10" fill="#102437" stroke="#22425C"/>
  <text x="740" y="138" fill="#D6AE5B" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.6">04 · PLAN</text>
  <text x="740" y="165" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">Terraform plan</text>
  <text x="740" y="185" fill="#8CA5BA" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="10.5">read-only role · locked state</text>

  <path d="M236 160H264" stroke="#5C82A0" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M464 160H492" stroke="#5C82A0" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M692 160H720" stroke="#5C82A0" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="496" y="272" width="196" height="88" rx="10" fill="#102437" stroke="#D6AE5B" stroke-opacity="0.75"/>
  <text x="512" y="294" fill="#D6AE5B" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.6">GATE · PROD</text>
  <text x="512" y="321" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">Manual approval</text>
  <text x="512" y="341" fill="#8CA5BA" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="10.5">sign-off before apply</text>

  <rect x="724" y="272" width="196" height="88" rx="10" fill="#102437" stroke="#22425C"/>
  <text x="740" y="294" fill="#D6AE5B" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.6">05 · APPLY</text>
  <text x="740" y="321" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">Terraform apply</text>
  <text x="740" y="341" fill="#8CA5BA" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="10.5">role + permissions boundary</text>

  <path d="M790 204C790 244 594 236 594 268" fill="none" stroke="#5C82A0" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="678" y="248" fill="#8CA5BA" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="10">prod</text>
  <path d="M850 204V268" fill="none" stroke="#D6AE5B" stroke-width="1.4" marker-end="url(#arG)"/>
  <text x="860" y="240" fill="#D6AE5B" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="10">dev · auto</text>
  <path d="M692 316H720" stroke="#5C82A0" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="40" y="400" width="880" height="72" rx="10" fill="#0F2337" stroke="#1F3B52"/>
  <text x="56" y="428" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600">Evidence and audit</text>
  <text x="56" y="450" fill="#8CA5BA" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11">run logs · SBOM · CloudTrail · runbook · rollback notes</text>
  <path d="M822 360V396" stroke="#5C82A0" stroke-width="1.4" marker-end="url(#ar)"/>

  <text x="40" y="500" fill="#7E99B0" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11">No long-lived credentials in the repository · every production change is reviewed and recorded</text>
</svg>
