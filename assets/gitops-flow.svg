<svg xmlns="http://www.w3.org/2000/svg" width="700" height="650" viewBox="0 0 700 650" role="img" aria-labelledby="title desc">
  <title id="title">GitOps delivery flow</title>
  <desc id="desc">Six-stage delivery flow: commit or pull request, quality and security gates, OIDC authentication to AWS, Terraform plan, controlled deployment, and audit evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.6" stop-color="#0A1D35"/>
      <stop offset="1" stop-color="#0E2640"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6E6B4"/>
      <stop offset="1" stop-color="#C79A45"/>
    </linearGradient>
  </defs>

  <rect width="700" height="650" rx="18" fill="url(#bg)" stroke="#15364E"/>
  <text x="28" y="48" fill="#F2F6FA" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="2.2">GITOPS DELIVERY FLOW</text>
  <text x="28" y="72" fill="#8FA8BD" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" letter-spacing="0.5">From reviewed change to auditable deployment</text>
  <text x="672" y="48" fill="#D6AE5B" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="1.8" text-anchor="end">DEVELOP · MAIN</text>
  <path d="M28 90H672" stroke="url(#gold)" stroke-width="1.2" stroke-opacity="0.45"/>
  <path d="M56 122V566" stroke="#1B4058" stroke-width="2"/>

  <g>
    <rect x="28" y="108" width="644" height="72" rx="10" fill="#0A1F33" stroke="#1B4058"/>
    <circle cx="56" cy="144" r="14" fill="#0E2A42" stroke="#4C7FB0" stroke-opacity="0.8"/>
    <text x="56" y="149" fill="#A9C7E2" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">01</text>
    <text x="84" y="140" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="600">Commit / pull request</text>
    <text x="84" y="162" fill="#8FA8BD" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5">Reviewed changes · develop and main</text>
    <rect x="640" y="122" width="3" height="44" rx="1.5" fill="#4C7FB0"/>
  </g>

  <g>
    <rect x="28" y="190" width="644" height="72" rx="10" fill="#0A1F33" stroke="#1B4058"/>
    <circle cx="56" cy="226" r="14" fill="#0E2A42" stroke="#1F6F7D" stroke-opacity="0.9"/>
    <text x="56" y="231" fill="#9ED0D9" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">02</text>
    <text x="84" y="222" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="600">Quality + security gates</text>
    <text x="84" y="244" fill="#8FA8BD" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5">Tests · build · Checkov · Trivy · Gitleaks · SBOM</text>
    <rect x="640" y="204" width="3" height="44" rx="1.5" fill="#1F6F7D"/>
  </g>

  <g>
    <rect x="28" y="272" width="644" height="72" rx="10" fill="#0A1F33" stroke="#1B4058"/>
    <circle cx="56" cy="308" r="14" fill="#0E2A42" stroke="#D6AE5B" stroke-opacity="0.8"/>
    <text x="56" y="313" fill="#E8C87F" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">03</text>
    <text x="84" y="304" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="600">OIDC to AWS</text>
    <text x="84" y="326" fill="#8FA8BD" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5">Temporary credentials · no static keys</text>
    <rect x="640" y="286" width="3" height="44" rx="1.5" fill="#D6AE5B"/>
  </g>

  <g>
    <rect x="28" y="354" width="644" height="72" rx="10" fill="#0A1F33" stroke="#1B4058"/>
    <circle cx="56" cy="390" r="14" fill="#0E2A42" stroke="#7A9FC2" stroke-opacity="0.8"/>
    <text x="56" y="395" fill="#C3D6E8" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">04</text>
    <text x="84" y="386" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="600">Terraform plan</text>
    <text x="84" y="408" fill="#8FA8BD" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5">Remote state · lock · KMS encryption</text>
    <rect x="640" y="368" width="3" height="44" rx="1.5" fill="#7A9FC2"/>
  </g>

  <g>
    <rect x="28" y="436" width="644" height="72" rx="10" fill="#0A1F33" stroke="#1B4058"/>
    <circle cx="56" cy="472" r="14" fill="#0E2A42" stroke="#2E7D8F" stroke-opacity="0.85"/>
    <text x="56" y="477" fill="#9ED0D9" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">05</text>
    <text x="84" y="468" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="600">Controlled deploy</text>
    <text x="84" y="490" fill="#8FA8BD" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5">Dev automatic · prod manual approval</text>
    <rect x="640" y="450" width="3" height="44" rx="1.5" fill="#2E7D8F"/>
  </g>

  <g>
    <rect x="28" y="518" width="644" height="72" rx="10" fill="#0A1F33" stroke="#1B4058"/>
    <circle cx="56" cy="554" r="14" fill="#0E2A42" stroke="#4C8C7A" stroke-opacity="0.85"/>
    <text x="56" y="559" fill="#A8D4C7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">06</text>
    <text x="84" y="550" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="600">Evidence</text>
    <text x="84" y="572" fill="#8FA8BD" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5">Logs · SBOM · CloudTrail · runbook</text>
    <rect x="640" y="532" width="3" height="44" rx="1.5" fill="#4C8C7A"/>
  </g>

  <path d="M28 612H672" stroke="#1B4058"/>
  <text x="28" y="634" fill="#7F98AE" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500">No credentials stored in the repository · production changes require approval</text>
</svg>
