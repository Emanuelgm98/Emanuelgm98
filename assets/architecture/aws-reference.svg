  <text x="692" y="433" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600">AWS KMS</text>
  <text x="692" y="453" fill="#8CA5BA" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11">customer-managed keys</text>

