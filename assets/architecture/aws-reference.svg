  <text x="58" y="157" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="17" font-weight="600">Web application</text>
  <text x="58" y="177" fill="#8CA5BA" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5">Browser · PKCE login</text>

  <rect x="272" y="108" width="280" height="84" rx="10" fill="#102437" stroke="#22425C"/>
