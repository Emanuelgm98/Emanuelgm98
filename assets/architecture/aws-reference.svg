<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc">
  <title id="title">AWS reference architecture — AURA Private Operations</title>
  <desc id="desc">Request path from browser through CloudFront and WAF into an AWS region: API Gateway validating Cognito JWT tokens, Lambda in private VPC subnets, RDS PostgreSQL Multi-AZ, DynamoDB and KMS, with CloudWatch and X-Ray, delivered by GitHub Actions using OIDC and separated Terraform roles.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#5C82A0"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#D6AE5B"/>
    </marker>
  </defs>

  <rect width="960" height="740" rx="18" fill="#0A1A2B" stroke="#1E3A52"/>
  <text x="40" y="50" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2.1">AWS REFERENCE ARCHITECTURE</text>
  <text x="40" y="74" fill="#8CA5BA" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5">AURA Private Operations · request path, data plane and delivery</text>
  <text x="920" y="50" fill="#D6AE5B" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="1.8" text-anchor="end">PRIVATE IMPLEMENTATION</text>
