  <text x="602" y="130" fill="#D6AE5B" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.8">IDENTITY</text>
  <text x="602" y="157" fill="#EAF1F7" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="17" font-weight="600">Amazon Cognito</text>
