 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF0B2"/><stop offset=".3" stop-color="#DDB65C"/><stop offset=".68" stop-color="#A97925"/><stop offset="1" stop-color="#F4D98C"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8CA9C4" stop-opacity=".15"/><stop offset=".5" stop-color="#D3DFEA" stop-opacity=".8"/><stop offset="1" stop-color="#8CA9C4" stop-opacity=".15"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="15"/></filter>
