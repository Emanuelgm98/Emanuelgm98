<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Emanuel G.Michea — AWS Cloud Engineering</title>
<desc id="desc">AWS-inspired dark navy cloud engineering banner with a gold GRIFFIN seal and Germanic blackletter name typography.</desc>
<defs>
