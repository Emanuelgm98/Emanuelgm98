<text x="95" y="215" fill="#9EB4C9" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="2.1">DEVSECOPS  ·  ARQUITECTURA CLOUD  ·  AUTOMATIZACIÓN</text>
